<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CRISP-DM 多元線性回歸 Demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/stlite.css" />
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/stlite.js";
    mount(
      {
        requirements: ["scikit-learn", "scipy", "plotly", "statsmodels"],
        entrypoint: "main.py",
        files: {
          "main.py": { url: "./main.py?v=5" },
          "data/50_Startups.csv": { url: "./data/50_Startups.csv?v=5" },
          "data/BostonHousing.csv": { url: "./data/BostonHousing.csv?v=5" },
        },
      },
      document.getElementById("root")
    );
  </script>
</body>
</html>
